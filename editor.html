<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>글쓰기 – 뉴스정보</title>
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#17212b;--muted:#5a6b7a;--rule:#cbd5dd;--accent:#0f6b6b;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--panel:#18222b;--ink:#e6edf2;--muted:#93a4b3;--rule:#2a3641;--accent:#5fc4c0;--danger:#f2877f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 80px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:18px;margin-bottom:18px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--rule);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:360px;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
button{padding:9px 14px;border:1px solid var(--rule);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.cols{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:1000px){.cols{grid-template-columns:1fr 1fr}}
#preview{font:16px/1.8 "Noto Serif KR",Georgia,serif;min-height:200px}
#preview img{max-width:100%;height:auto;display:block;margin:1em 0}
#preview h2{font-size:21px;margin:1.6em 0 .4em}
.status{margin-top:12px;min-height:22px;color:var(--muted)}
.status.err{color:var(--danger)}
.status.ok{color:var(--accent);font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.item small{color:var(--muted)}
.cover-prev{max-width:240px;margin-top:8px;display:block}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>글쓰기</h1>
  <p class="sub">글과 이미지를 저장소에 바로 올립니다. 발행하면 1~2분 뒤 사이트에 반영됩니다.</p>

  <details class="panel" id="settings">
    <summary>저장소 연결 설정</summary>
    <div class="row">
      <div><label for="c-owner">GitHub 사용자</label><input id="c-owner" value="amazon9809"></div>
      <div><label for="c-repo">저장소 이름</label><input id="c-repo" value="news"></div>
      <div><label for="c-branch">브랜치</label><input id="c-branch" value="main"></div>
    </div>
    <label for="c-token">액세스 토큰</label>
    <input id="c-token" type="password" autocomplete="off" placeholder="github_pat_…">
    <p class="sub" style="margin-top:8px">토큰은 이 브라우저에만 저장되고, GitHub 외에는 어디로도 보내지 않습니다. 공용 컴퓨터에서는 쓰지 마세요.</p>
    <button id="saveCfg" class="primary">설정 저장</button>
  </details>

  <div class="panel">
    <h2>올린 글</h2>
    <div id="list"><p class="sub">불러오는 중…</p></div>
  </div>

  <div class="cols">
    <div class="panel">
      <h2 id="formTitle">새 글</h2>
      <label for="f-title">제목</label><input id="f-title">
      <div class="row">
        <div><label for="f-date">날짜</label><input id="f-date" type="date"></div>
        <div><label for="f-cat">분류</label><input id="f-cat" placeholder="경제, IT …"></div>
        <div><label for="f-id">주소 ID</label><input id="f-id" placeholder="자동 생성"></div>
      </div>
      <label for="f-sum">요약 (목록에 보이는 한 줄)</label><input id="f-sum">
      <label for="f-src">출처 링크 (선택)</label><input id="f-src" type="url" placeholder="https://">

      <label>대표 이미지</label>
      <input id="coverFile" type="file" accept="image/*">
      <img id="coverPrev" class="cover-prev" alt="" hidden>
      <button id="coverClear" type="button" hidden>대표 이미지 지우기</button>

      <label for="f-body">본문 (HTML)</label>
      <div class="tools">
        <button type="button" data-wrap="h2">소제목</button>
        <button type="button" data-wrap="strong">굵게</button>
        <button type="button" data-wrap="p">문단</button>
        <button type="button" id="btnLink">링크</button>
        <button type="button" id="btnImg">이미지 넣기</button>
        <input id="bodyFile" type="file" accept="image/*" hidden>
      </div>
      <textarea id="f-body" placeholder="<p>본문을 입력하세요.</p>"></textarea>

      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button id="publish" class="primary">발행</button>
        <button id="reset" type="button">새로 쓰기</button>
      </div>
      <div id="status" class="status" role="status"></div>
    </div>

    <div class="panel">
      <h2>미리보기</h2>
      <div id="preview"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cfg = JSON.parse(localStorage.getItem("news-editor") || "{}");
let posts = [];
let pending = {};      // 경로 -> {b64, url}
let editingId = null;
let coverPath = "";

/* ---- 설정 ---- */
["owner","repo","branch","token"].forEach(k => { if (cfg[k]) $("c-"+k).value = cfg[k]; });
if (!cfg.token) $("settings").open = true;
$("saveCfg").onclick = () => {
  cfg = {owner:$("c-owner").value.trim(), repo:$("c-repo").value.trim(), branch:$("c-branch").value.trim()||"main", token:$("c-token").value.trim()};
  localStorage.setItem("news-editor", JSON.stringify(cfg));
  setStatus("설정을 저장했습니다.", "ok"); loadPosts();
};

function setStatus(msg, kind) { const s = $("status"); s.textContent = msg; s.className = "status " + (kind||""); }

/* ---- GitHub API ---- */
async function api(path, opts = {}) {
  const sep = path.includes("?") ? "&" : "?";
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/${path}` + ((!opts.method || opts.method === "GET") ? sep + "_=" + Date.now() : "");
  const r = await fetch(url, {
    cache: "no-store",
    ...opts,
    headers: {Authorization:"Bearer "+cfg.token, Accept:"application/vnd.github+json", "Content-Type":"application/json"}
  });
  if (r.status === 404 && (!opts.method || opts.method === "GET")) return null;
  if (!r.ok) {
    let m = r.status + ""; try { m += " " + (await r.json()).message; } catch (e) {}
    if (r.status === 401 || r.status === 403) m += " (토큰 권한을 확인하세요)";
    throw new Error(m);
  }
  return r.json();
}
const toB64 = str => { let s = ""; new TextEncoder().encode(str).forEach(x => s += String.fromCharCode(x)); return btoa(s); };
const fromB64 = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, "")), c => c.charCodeAt(0)));

async function getPostsFile() {
  const d = await api(`contents/posts.json?ref=${encodeURIComponent(cfg.branch)}`);
  return d ? {sha: d.sha, posts: JSON.parse(fromB64(d.content))} : {sha: null, posts: []};
}
function putFile(path, b64, message, sha) {
  const body = {message, content: b64, branch: cfg.branch}; if (sha) body.sha = sha;
  return api("contents/" + path, {method:"PUT", body: JSON.stringify(body)});
}

/* ---- 글 목록 ---- */
async function loadPosts() {
  if (!cfg.token) { $("list").innerHTML = '<p class="sub">위의 저장소 연결 설정에서 토큰을 먼저 저장하세요.</p>'; return; }
  try { posts = (await getPostsFile()).posts; renderList(); }
  catch (e) { $("list").innerHTML = `<p class="sub">불러오지 못했습니다: ${esc(e.message)}</p>`; }
}
function renderList() {
  $("list").innerHTML = posts.length ? posts.map(p => `
    <div class="item"><div><strong>${esc(p.title)}</strong><br><small>${esc(p.date)} · ${esc(p.category||"")}</small></div>
    <div><button data-edit="${esc(p.id)}">수정</button> <button class="danger" data-del="${esc(p.id)}">삭제</button></div></div>`).join("")
    : '<p class="sub">아직 글이 없습니다.</p>';
}
$("list").onclick = async e => {
  const ed = e.target.dataset.edit, del = e.target.dataset.del;
  if (ed) { const p = posts.find(x => x.id === ed); if (p) fillForm(p); }
  if (del) {
    const p = posts.find(x => x.id === del);
    if (!p || !confirm(`"${p.title}" 글을 삭제할까요?`)) return;
    try {
      setStatus("삭제하는 중…");
      let rest;
      for (let t = 0; t < 3; t++) {
        const f = await getPostsFile(); rest = f.posts.filter(x => x.id !== del);
        try { await putFile("posts.json", toB64(JSON.stringify(rest, null, 2)), "글 삭제: " + del, f.sha); break; }
        catch (e) { if (!String(e.message).startsWith("409") || t === 2) throw e; await new Promise(r => setTimeout(r, 800)); }
      }
      posts = rest; renderList(); setStatus("삭제했습니다. 1~2분 뒤 사이트에 반영됩니다.", "ok");
    } catch (err) { setStatus("삭제 실패: " + err.message, "err"); }
  }
};

/* ---- 폼 ---- */
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function fillForm(p) {
  editingId = p ? p.id : null;
  $("formTitle").textContent = p ? "글 수정" : "새 글";
  $("f-title").value = p ? p.title : ""; $("f-date").value = p ? p.date : today();
  $("f-cat").value = p ? p.category||"" : ""; $("f-id").value = p ? p.id : "";
  $("f-id").readOnly = !!p;
  $("f-sum").value = p ? p.summary||"" : ""; $("f-src").value = p ? p.source||"" : "";
  $("f-body").value = p ? p.html : ""; coverPath = p ? p.image||"" : ""; pending = {};
  updateCover(); updatePreview(); setStatus(""); window.scrollTo({top: $("formTitle").offsetTop - 20, behavior:"smooth"});
}
$("reset").onclick = () => fillForm(null);

/* ---- 이미지 ---- */
function processImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      c.toBlob(b => {
        const fr = new FileReader();
        fr.onload = () => resolve({b64: fr.result.split(",")[1], url: URL.createObjectURL(b)});
        fr.readAsDataURL(b);
      }, "image/jpeg", .85); URL.revokeObjectURL(url);
    };
    img.onerror = () => reject(new Error("이미지를 읽을 수 없습니다."));
    img.src = url;
  });
}
async function addImage(file) {
  const r = await processImage(file);
  const path = "images/" + Date.now() + "-" + Math.floor(Math.random()*1000) + ".jpg";
  pending[path] = r; return path;
}
function srcFor(path) { return pending[path] ? pending[path].url : path; }
function updateCover() {
  const has = !!coverPath;
  $("coverPrev").hidden = !has; $("coverClear").hidden = !has;
  if (has) $("coverPrev").src = srcFor(coverPath);
}
$("coverFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { coverPath = await addImage(f); updateCover(); updatePreview(); } catch (err) { setStatus(err.message, "err"); }
  e.target.value = "";
};
$("coverClear").onclick = () => { coverPath = ""; updateCover(); updatePreview(); };

/* ---- 본문 도구 ---- */
function insertAtCursor(text, selWrap) {
  const t = $("f-body"), s = t.selectionStart, e = t.selectionEnd;
  t.setRangeText(selWrap ? selWrap[0] + t.value.slice(s, e) + selWrap[1] : text, s, e, "end");
  t.focus(); updatePreview();
}
document.querySelectorAll("[data-wrap]").forEach(b => b.onclick = () => { const k = b.dataset.wrap; insertAtCursor("", ["<"+k+">", "</"+k+">"]); });
$("btnLink").onclick = () => { const u = prompt("링크 주소를 입력하세요", "https://"); if (u) insertAtCursor("", ['<a href="'+u+'" target="_blank" rel="noopener">', "</a>"]); };
$("btnImg").onclick = () => $("bodyFile").click();
$("bodyFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const p = await addImage(f); insertAtCursor('\n<img src="'+p+'" alt="">\n'); } catch (err) { setStatus(err.message, "err"); }
  e.target.value = "";
};

/* ---- 미리보기 ---- */
function updatePreview() {
  let html = $("f-body").value;
  Object.keys(pending).forEach(p => { html = html.split(p).join(pending[p].url); });
  $("preview").innerHTML = (coverPath ? `<img src="${esc(srcFor(coverPath))}" alt="">` : "") +
    `<h1 style="font-size:28px;line-height:1.4">${esc($("f-title").value)}</h1>` + html;
}
["f-title","f-body"].forEach(id => $(id).addEventListener("input", updatePreview));

/* ---- 발행 ---- */
$("publish").onclick = async () => {
  if (!cfg.token) { $("settings").open = true; return setStatus("먼저 토큰을 저장하세요.", "err"); }
  const title = $("f-title").value.trim(), html = $("f-body").value.trim();
  if (!title || !html) return setStatus("제목과 본문을 입력하세요.", "err");
  let id = $("f-id").value.trim().toLowerCase().replace(/[^a-z0-9-]/g, "-");
  if (!id) { const n = new Date(); id = "p" + n.getFullYear() + String(n.getMonth()+1).padStart(2,"0") + String(n.getDate()).padStart(2,"0") + "-" + String(n.getHours()).padStart(2,"0") + String(n.getMinutes()).padStart(2,"0"); }
  $("publish").disabled = true;
  try {
    const used = Object.keys(pending).filter(p => html.includes(p) || p === coverPath);
    for (let i = 0; i < used.length; i++) {
      setStatus(`이미지 올리는 중… (${i+1}/${used.length})`);
      await putFile(used[i], pending[used[i]].b64, "이미지 추가: " + used[i]);
    }
    setStatus("글 저장하는 중…");
    const post = {id, title, date: $("f-date").value || today(), category: $("f-cat").value.trim(), summary: $("f-sum").value.trim(), image: coverPath, source: $("f-src").value.trim(), html};
    let list;
    for (let t = 0; t < 3; t++) {
      const f = await getPostsFile();
      list = f.posts.filter(p => p.id !== (editingId || id) && p.id !== id);
      list.push(post); list.sort((a, b) => b.date.localeCompare(a.date));
      try { await putFile("posts.json", toB64(JSON.stringify(list, null, 2)), (editingId ? "글 수정: " : "글 발행: ") + id, f.sha); break; }
      catch (e) { if (!String(e.message).startsWith("409") || t === 2) throw e; await new Promise(r => setTimeout(r, 800)); }
    }
    posts = list; renderList(); pending = {}; editingId = id; $("f-id").value = id; $("f-id").readOnly = true;
    $("formTitle").textContent = "글 수정";
    setStatus("발행했습니다. 1~2분 뒤 사이트에 반영됩니다.", "ok");
  } catch (err) { setStatus("발행 실패: " + err.message, "err"); }
  $("publish").disabled = false;
};

fillForm(null); loadPosts();
</script>
</body>
</html>
