<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뉴스정보</title>
<meta name="description" content="뉴스정보 – 핵심만 짧게 정리한 소식">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--ink:#17212b;--muted:#5a6b7a;--rule:#cbd5dd;--accent:#0f6b6b;--adbg:rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--ink:#e6edf2;--muted:#93a4b3;--rule:#2a3641;--accent:#5fc4c0;--adbg:rgba(255,255,255,.05)}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:17px/1.85 "Noto Serif KR",Georgia,serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:16px;margin-bottom:24px;font-family:"Noto Sans KR",sans-serif}
header a.site{font-weight:600;font-size:18px;color:var(--ink);text-decoration:none}
header span{color:var(--muted);font-size:14px}
.ad-top{display:flex;justify-content:center;margin:0 auto 28px;min-height:50px}
.layout{max-width:680px;margin:0 auto}
.ad-mid{display:flex;justify-content:center;margin:28px 0;min-height:50px}


/* 글 목록 */
.post-item{display:grid;grid-template-columns:110px 1fr;gap:6px 20px;padding:22px 0;border-bottom:1px solid var(--rule)}
.post-item:first-child{padding-top:0}
.post-item .meta{font:400 14px/1.7 "Noto Sans KR",sans-serif;color:var(--muted)}
.post-item h2{margin:0;font-size:21px;line-height:1.5}
.post-item h2 a{color:var(--ink);text-decoration:none}
.post-item h2 a:hover{color:var(--accent);text-decoration:underline}
.post-item p{margin:0;color:var(--muted);font-size:15px;line-height:1.7}
.post-item .thumb{grid-column:2;display:block;width:100%;max-width:320px;aspect-ratio:16/9;object-fit:cover;background:var(--rule);margin-bottom:6px}
.post-item .txt{grid-column:2}

/* 글 보기 */
article h1{font-size:32px;line-height:1.4;margin:0 0 8px}
article time{font:400 14px "Noto Sans KR",sans-serif;color:var(--muted)}
article .cover{display:block;width:100%;height:auto;margin:24px 0 0}
article .body{margin-top:28px}
article .body h2{font-size:22px;margin:2em 0 .4em}
article .body img{max-width:100%;height:auto;display:block;margin:1.4em 0}
article .body code{font-size:.9em;background:var(--rule);padding:1px 6px;border-radius:3px}
.src{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);font:400 14px "Noto Sans KR",sans-serif;color:var(--muted)}
.back{display:inline-block;margin-bottom:20px;font:400 14px "Noto Sans KR",sans-serif}
footer{margin-top:56px;color:var(--muted);font:400 13px "Noto Sans KR",sans-serif}
@media (max-width:560px){.post-item{grid-template-columns:1fr}.post-item .thumb,.post-item .txt{grid-column:1;max-width:none}article h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="site" href="#/">뉴스정보</a>
    <span>핵심만 짧게 정리합니다</span>
  </header>

  <!-- 상단 광고 (카카오 애드핏) -->
  <div class="ad-top">
    <ins class="kakao_ad_area" style="display:none;"
      data-ad-unit="DAN-c5QQGJp11vYFryEP"
      data-ad-width="320"
      data-ad-height="50"></ins>
    <script type="text/javascript" src="//t1.kakaocdn.net/kas/static/ba.min.js" async></script>
  </div>

  <div class="layout">
    <main id="app"></main>
  </div>

  <footer>© <span id="y"></span> 뉴스정보</footer>
</div>

<script>
/* ===== 중간 광고 (카카오 애드핏) ===== */
const MID_AD = `<div class="ad-mid"><ins class="kakao_ad_area" style="display:none;" data-ad-unit="DAN-g5KAvJ47oxKVfx9s" data-ad-width="320" data-ad-height="50"></ins></div>`;
function loadAdfit(root) {
  if (!root.querySelector("ins.kakao_ad_area")) return;
  const sc = document.createElement("script");
  sc.async = true; sc.src = "//t1.kakaocdn.net/kas/static/ba.min.js";
  root.appendChild(sc);
}

/* ===== 글 목록 =====
   글은 posts.json 에 저장됩니다. 글쓰기는 editor.html 에서 하세요. */
let POSTS = [];

const app = document.getElementById("app");
document.getElementById("y").textContent = new Date().getFullYear();

const fmt = d => d.replace(/-/g, ".");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderList() {
  document.title = "뉴스정보";
  const items = POSTS.map((p, i) => `
    <section class="post-item">
      <div class="meta"><time datetime="${p.date}">${fmt(p.date)}</time><br>${esc(p.category || "")}</div>
      <div class="txt">
        ${p.image ? `<a href="#/${p.id}"><img class="thumb" src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy"></a>` : ""}
        <h2><a href="#/${p.id}">${esc(p.title)}</a></h2>
        <p>${esc(p.summary)}</p>
      </div>
    </section>${i === Math.min(2, POSTS.length - 1) ? MID_AD : ""}`).join("");
  app.innerHTML = items;
  loadAdfit(app);
}

function renderPost(id) {
  const p = POSTS.find(x => x.id === id);
  if (!p) {
    app.innerHTML = `<p>글을 찾을 수 없습니다. <a href="#/">목록으로 돌아가기</a></p>`;
    return;
  }
  document.title = p.title + " – 뉴스정보";
  // 본문 두 번째 문단 뒤에 중간 광고 삽입 (문단이 적으면 첫 문단 뒤)
  const parts = p.html.split("</p>");
  const at = parts.length > 3 ? 2 : 1;
  const body = parts.map((t, i) => (i < parts.length - 1 ? t + "</p>" : t) + (i === at - 1 ? MID_AD : "")).join("");
  app.innerHTML = `
    <a class="back" href="#/">목록으로 돌아가기</a>
    <article>
      <h1>${esc(p.title)}</h1>
      <time datetime="${p.date}">${fmt(p.date)}${p.category ? " · " + esc(p.category) : ""}</time>
      ${p.image ? `<img class="cover" src="${esc(p.image)}" alt="${esc(p.title)}">` : ""}
      <div class="body">${body}</div>
      ${p.source ? `<p class="src">출처: <a href="${esc(p.source)}" rel="noopener" target="_blank">${esc(new URL(p.source).hostname)}</a></p>` : ""}
    </article>`;
  loadAdfit(app);
}

function route() {
  const id = location.hash.replace(/^#\/?/, "");
  id ? renderPost(id) : renderList();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
fetch("posts.json?t=" + Date.now())
  .then(r => r.json())
  .then(d => { POSTS = d; route(); })
  .catch(() => { app.innerHTML = "<p>글을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>"; });
</script>
</body>
</html>
